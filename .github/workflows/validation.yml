name: Validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore tests/AvroPartitionWriter.Tests/AvroPartitionWriter.Tests.csproj
      - run: dotnet build src/AvroPartitionWriter/AvroPartitionWriter.csproj --configuration Release --no-restore
      - run: dotnet test tests/AvroPartitionWriter.Tests/AvroPartitionWriter.Tests.csproj --configuration Release --no-restore
      - run: dotnet run --project examples/RotationDemo --configuration Release
